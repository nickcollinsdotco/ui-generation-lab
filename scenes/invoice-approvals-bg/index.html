<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice approvals (background)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@300;400;500;600&family=Stack+Sans+Headline:wght@400&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  /* Figma frame 8860:19430 (1080×1440 IG post), built at 0.5× = 540×720.
     Render with --size 540x720 --scale 2 for a 1080×1440 video. */
  html, body { margin: 0; height: 100%; }
  body {
    position: relative; overflow: hidden;
    background: #0a0a0a;
    font: 300 13px/19px "Stack Sans Text", system-ui, sans-serif;
    color: #a3a3a3;
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; white-space: nowrap; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 400; }

  /* background: photo at 60%, soft blur + 15% black, soft-light noise */
  .bg { position: absolute; inset: 0; overflow: hidden; opacity: .6; }
  .bg img { position: absolute; left: -42px; top: -53.5px; width: 624.44px; height: 829px; object-fit: cover; }
  .veil { position: absolute; inset: 0; background: rgb(0 0 0 / .15); backdrop-filter: blur(3px); }
  .noise { position: absolute; inset: 0; background: url(noise.png) 0 0 / 512px 512px; mix-blend-mode: soft-light; }
  .wordmark { position: absolute; left: 40px; top: 120px; width: 144.29px; height: 18px; display: block; }

  .frame {
    position: absolute; left: 37.5px; top: 177.5px;
    width: 465px; box-sizing: border-box; padding: 16px;
    border: 2px solid rgb(255 255 255 / .4); border-radius: 32px;
    background: rgb(255 255 255 / .1); backdrop-filter: blur(10px);
  }

  /* header */
  .card-head {
    display: flex; align-items: center; gap: 12.6px; padding: 16px;
    background: #111214; border: 1px solid rgb(250 250 250 / .08); border-radius: 16px 16px 0 0;
  }
  .tile {
    display: grid; place-items: center; flex: none; width: 40.4px; height: 40.4px; box-sizing: border-box;
    background: #18181b; border: .95px solid #27272a; border-radius: 10.1px;
  }
  .tile svg { width: 20.3px; height: 17.7px; display: block; }
  .title {
    flex: 1; min-width: 0;
    font-family: "Stack Sans Headline", system-ui, sans-serif; font-weight: 400;
    font-size: 20.2px; line-height: 31px; color: #fafafa;
  }
  .seg { display: flex; gap: 2.5px; padding: 2.5px; background: #0a0a0a; border: .63px solid #404040; border-radius: 7.6px; }
  .seg span { padding: 6.3px 10.1px; border-radius: 5px; font-weight: 500; font-size: 10.1px; line-height: 15.2px; color: #d4d4d4; }
  .seg span.on { background: #262626; color: #fafafa; }

  /* content */
  .content { position: relative; display: flex; flex-direction: column; gap: 8px; }
  .panel {
    display: flex; flex-direction: column; gap: 40.4px; padding: 12px 16px;
    background: #171717; border: 1px solid #262626;
  }
  .stat { position: relative; height: 25.3px; }
  .stat .big { font-size: 25.3px; line-height: 1; letter-spacing: -.5px; color: #fafafa; }
  .stat .sub { margin-top: 3.8px; font-size: 11.4px; line-height: normal; color: #71717a; text-transform: uppercase; }
  .pending { position: absolute; right: 0; top: 6.3px; display: flex; align-items: center; gap: 5px; }
  .pending svg { width: 15.2px; height: 15.2px; display: block; }
  .pending p { font-size: 12.6px; line-height: 1; color: #d4d4d4; text-transform: uppercase; }

  .table { display: flex; flex-direction: column; gap: 7.6px; }
  .tr { display: flex; align-items: center; justify-content: space-between; }
  .th { font-size: 9px; line-height: 17.7px; letter-spacing: .36px; text-transform: uppercase; }
  .c-co { width: 65.7px; }
  .c-amt { width: 75px; text-align: right; }
  .c-st { width: 91.6px; display: flex; justify-content: flex-end; }
  .td-row { opacity: .5; }
  .td-row .c-co { font-size: 13px; line-height: 19px; }
  .num { font-size: 12px; line-height: 1; letter-spacing: -.24px; }
  .rule { height: 1px; background: #404040; }
  .badge {
    display: flex; align-items: center; gap: 2.5px; padding: 2.5px 6.3px 2.5px 5px;
    background: #0a0a0a; border: .63px solid #404040; border-radius: 4px;
    font-weight: 500; font-size: 8.85px; line-height: 12.6px; color: #d4d4d4;
  }
  .badge svg { width: 7.6px; height: 7.6px; display: block; }

  .review {
    padding: 12px; background: #262626; border: .63px solid #262626; border-radius: 0 0 16px 16px;
  }
  .review-row {
    display: flex; align-items: center; justify-content: space-between; padding: 6px;
    background: rgb(255 255 255 / .1); border: .63px solid #404040; border-radius: 6px;
  }
  .review-row .c-co { font-size: 13px; line-height: 19px; color: #fafafa; }
  .review-row .num { width: 82px; text-align: right; color: #fafafa; }
  .actions { display: flex; gap: 5px; }
  .btn { padding: 6px 9.3px; border-radius: 6px; font-weight: 600; font-size: 9px; line-height: 12px; }
  .btn.ghost {
    background: rgb(10 10 10 / .2); color: #d4d4d4;
    box-shadow: inset 0 0 0 .63px rgb(0 0 0 / .18), inset 0 -1.26px 0 rgb(0 0 0 / .05);
  }
  .btn.solid { background: #fff; color: #000; }

  .switch-field {
    display: flex; align-items: center; gap: 40.4px; height: 70.3px; box-sizing: border-box; padding: 15.2px;
    background: #171717; border: .63px solid #262626; border-radius: 16px;
  }
  .switch-field .text { flex: 1; display: flex; flex-direction: column; gap: 3.8px; }
  .switch-field .t { font-weight: 500; font-size: 14px; line-height: normal; color: #fafafa; }
  .switch-field .d { font-size: 10px; line-height: normal; color: #71717a; text-transform: uppercase; }
  .switch-field svg { width: 40.4px; height: 22.7px; display: block; flex: none; }

  .cursor {
    position: absolute; right: 4.6px; bottom: 77.3px; width: 27.8px; height: 31.07px;
    transform: rotate(-14.13deg); pointer-events: none;
  }
  .cursor svg { display: block; width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
  <div class="bg"><img src="bg.jpg" alt=""></div>
  <div class="veil"></div>
  <div class="noise"></div>

  <!-- data-generate marks the element render.mjs animates -->
  <section class="frame" data-generate aria-label="Invoice approvals">
    <header class="card-head">
      <div class="tile">
        <svg viewBox="0 0 40.5785 35.3846" fill="none" aria-hidden="true">
          <path d="M19.467 0.471179L0.130196 33.9618C-0.239357 34.5901 0.222583 35.3846 0.952448 35.3846H39.6261C40.3559 35.3846 40.8179 34.5901 40.4483 33.9618L21.1115 0.471179C20.742 -0.15706 19.8366 -0.15706 19.467 0.471179Z" fill="url(#sym)"/>

        </svg>
      </div>
      <p class="title">Invoice approvals</p>
      <div class="seg">
        <span>Manual</span>
        <span class="on">Automatic</span>
      </div>
    </header>

    <div class="content">
      <div>
        <div class="panel">

              </svg>
              <p class="mono">1 pending</p>
            </div>
          </div>

          <div class="table">
            <div class="tr mono th">
              <p class="c-co">Company</p><p class="c-amt">Amount</p><div class="c-st"><p>Status</p></div>
            </div>
            <div class="rule"></div>

              <p class="c-co">Google Ads</p><p class="mono num c-amt">€212</p>
