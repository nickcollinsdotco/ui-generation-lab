<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editorial scene</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    background: #f4f4f2; color: #18181b;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* each part has its own variant and start (data-generate / data-generate-delay). Agent log and step line
     only draw where the page is empty, so this tight stack effectively uses plain skeleton. */
  .story { width: 420px; margin-bottom: 140px; }
  .eyebrow { margin: 0 0 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #71717a; }
  h1 { margin: 0 0 14px; font-size: 48px; line-height: 1.02; font-weight: 600; letter-spacing: -.02em; }
  .dek { margin: 0 0 22px; color: #52525b; }
  img { display: block; width: 100%; height: 220px; object-fit: cover; border-radius: 16px; }
</style>
</head>
<body>
  <article class="story">
    <p class="eyebrow" data-generate="small-text">Field notes · Spring</p>
    <h1 data-generate="text" data-generate-delay="150">Tulips in the long light</h1>
    <p class="dek" data-generate="small-text" data-generate-delay="700">Five stems against a pale sky, drawn first in dots, then in colour.</p>
    <!-- data-generate goes on a wrapper, never on the <img> itself -->
    <div class="photo" data-generate="image" data-generate-delay="400"><img src="./tulips.jpg" alt="Five pink tulips on long stems against a pale blue sky" /></div>
  </article>
</body>
</html>
